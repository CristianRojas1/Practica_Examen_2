---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-api
  template:
    metadata:
      labels:
        app: customers-api
    spec:
      containers:
        - name: customers-api
          image: docker.io/library/customers-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PASS
              value: "X$wcbHNjLGA8buCWtglQ9wHp"
            - name: ENCRYPTION_KEY
              value: "9f88d01fd45a341fff9c5f42853c2ba879e4829ff31f6d2a03793a87b97c7900"
          resources:
            requests: {memory: "64Mi", cpu: "100m"}
            limits: {memory: "256Mi", cpu: "500m"}
          livenessProbe:
            httpGet: {path: /api/customers/healthz, port: 3003}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /api/customers/healthz, port: 3003}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
spec:
  selector:
    app: customers-api
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafeaurora-ingress
spec:
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 3001
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 3002
          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: customers-service
                port:
                  number: 3003
