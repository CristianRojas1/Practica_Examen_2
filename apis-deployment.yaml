apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: docker.io/library/catalog-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PASS
              value: "X$wcbHNjLGA8buCWtglQ9wHp"
          resources:
            requests: {memory: "64Mi", cpu: "100m"}
            limits: {memory: "256Mi", cpu: "500m"}
          livenessProbe:
            httpGet: {path: /api/catalog/healthz, port: 3001}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /api/catalog/healthz, port: 3001}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
